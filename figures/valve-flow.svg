<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 390" role="img" aria-labelledby="title desc">
  <title id="title">Net flow before and after the valve switch</title>
  <desc id="desc">Curved rate from (0,6) to an open point at (2,2). A separate line starts at the filled point (2,−4), crosses zero at minute 4 and ends at (7,6).</desc>
  <rect width="680" height="390" fill="#fff"/>
  <path d="M80 65H610 M80 113H610 M80 161H610 M80 209H610 M80 257H610 M80 305H610" stroke="#d7e1e8"/>
  <path d="M80 65V305H610 M80 209H610" fill="none" stroke="#16252e" stroke-width="2"/>
  <path d="M224 65V305" stroke="#637985" stroke-dasharray="5 5"/>
  <path d="M80 65Q152 65 224 161" fill="none" stroke="#0f527b" stroke-width="4"/>
  <path d="M224 305L584 65" fill="none" stroke="#813710" stroke-width="4"/>
  <circle cx="80" cy="65" r="5" fill="#0f527b"/>
  <circle cx="224" cy="161" r="7" fill="#fff" stroke="#0f527b" stroke-width="3"/>
  <circle cx="224" cy="305" r="6" fill="#813710"/>
  <circle cx="584" cy="65" r="5" fill="#813710"/>
  <g font-family="system-ui,sans-serif" font-size="16" fill="#16252e">
    <text x="80" y="32">Net flow (liters per minute)</text>
    <text x="345" y="365" text-anchor="middle">Elapsed time (minutes)</text>
    <g text-anchor="end"><text x="69" y="70">6</text><text x="69" y="118">4</text><text x="69" y="166">2</text><text x="69" y="214">0</text><text x="69" y="262">−2</text><text x="69" y="310">−4</text></g>
    <g text-anchor="middle"><text x="80" y="330">0</text><text x="224" y="330">2</text><text x="368" y="330">4</text><text x="584" y="330">7</text></g>
    <text x="238" y="154">Left limit: 2</text><text x="211" y="296" text-anchor="end">Switch sample: −4</text>
  </g>
</svg>
